name: Deploy backend
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        working-directory: ./src/Backend
        run: dotnet build --configuration Release
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test
        working-directory: ./src/Backend.Tests
        run: |
          dotnet build
          dotnet test bin/Debug/net8.0/Backend.Tests.dll
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        working-directory: ./src/Backend
        run: dotnet build --configuration Release
      - name: Set up Docker Buildx
        run: |
          docker buildx create --use
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY_URL }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
      - name: Build and push container image to Azure Container Registry
        run: |
          docker system prune -a -f
          docker buildx build --push --tag ${{ secrets.CONTAINER_REGISTRY_URL }}/${{ secrets.BACKEND_NAME }}:latest --file ./src/Backend/Dockerfile .
      - name: Azure Login
        run: |
          OUTPUT=$(az login --output none --service-principal -u ${{ secrets.AZURE_APP_ID }} -p ${{ secrets.AZURE_PASSWORD }} --tenant ${{ secrets.AZURE_TENANT }} 2>&1)
          if [ $? -ne 0 ]; then
            echo "Failed to log in to Azure: $OUTPUT"
            exit 1
          else
            echo "Logged in to Azure successfully"
          fi
      - name: Deploy to Azure Container Apps
        run: |
          OUTPUT=$(az containerapp update --output none --name ${{ secrets.BACKEND_NAME }} --resource-group ${{ secrets.RESOURCE_GROUP }} --image ${{ secrets.CONTAINER_REGISTRY_URL }}/${{ secrets.BACKEND_NAME }}:latest --replace-env-vars ASPNETCORE_ENVIRONMENT=Production FRONTEND_URL=https://${{ secrets.FRONTEND_NAME }}.${{ secrets.FRONTEND_SUBDOMAIN }}.${{ secrets.FRONTEND_REGION }}.azurecontainerapps.io DB_SERVER=${{ secrets.DB_SERVER_NAME }}.database.windows.net DB=${{ secrets.DB }} DB_USER=${{ secrets.DB_USER }} DB_PASSWORD=${{ secrets.DB_PASSWORD }} JWT_SECRET=${{ secrets.JWT_SECRET }} 2>&1)
          if [ $? -ne 0 ]; then
            echo "Failed to deploy container app: $OUTPUT"
            exit 1
          else
            echo "Container app deployment has finished successfully"
          fi