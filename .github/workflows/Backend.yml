name: Backend
on: push
env:
  AZURE_CONTAINER_REGISTRY: crwebappstarterpack
  CONTAINER_APP_NAME: ca-backend
  RESOURCE_GROUP: rg-WebAppStarterPack
  REGISTRY_LOGIN_SERVER: crwebappstarterpack.azurecr.io
jobs:
