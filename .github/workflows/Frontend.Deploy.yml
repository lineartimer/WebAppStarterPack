name: Deploy frontend
on: push
env:
  CONTAINER_APP_NAME: ca-frontend
  RESOURCE_GROUP: rg-WebAppStarterPack
jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v3
      - name: Use node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      - name: Build frontend
        working-directory: ./src/Frontend
        run: |
          npm install
          npm run build
  unit-test: 
    needs: build
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - name: Build frontend
        working-directory: ./src/Frontend
        run: |
          npm install
          CI=true npm test
  e2e-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build and run backend
        working-directory: ./src/Backend
        run: |
          dotnet build --configuration Release
          nohup dotnet run --configuration Release > backend.log 2>&1 &
          echo "Backend PID: $!"
          sleep 30
          more backend.log
          echo "Verifying if backend is running"
          curl -k -v https://localhost:5000/Data
      - name: Build and run frontend
        working-directory: ./src/Frontend
        run: |
          npm install
          npm run build
          nohup npm run dev > frontend.log 2>&1 &
          echo "Frontend PID: $!"
          sleep 30
          more frontend.log
          echo "Verifying if frontend is running"
          curl -k -v https://localhost:3000
      - name: Run E2E tests
        working-directory: ./src/Frontend/e2e-tests
        run: |
          npm install
          npx playwright install
          npm test
  deploy:
    needs: [unit-test, e2e-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Use node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      - name: Build frontend
        working-directory: ./src/Frontend
        run: |
          npm install
          npm run build
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}.azurecr.io
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
      - name: Build Docker image
        working-directory: ./src/Frontend
        run: |
          docker build . -t ${{ secrets.CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:latest
          docker push ${{ secrets.CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:latest
      - name: Azure Login
        run: |
          az login --service-principal -u ${{ secrets.AZURE_APP_ID }} -p ${{ secrets.AZURE_PASSWORD }} --tenant ${{ secrets.AZURE_TENANT }}
      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ secrets.CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:latest