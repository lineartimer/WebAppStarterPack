name: Test frontend
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - name: Build frontend
        working-directory: ./src/Frontend
        run: |
          npm install
          npm run build
  unit-test: 
    needs: build
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - name: Build frontend
        working-directory: ./src/Frontend
        run: |
          npm install
          CI=true npm test
  e2e-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Start backend
        working-directory: ./src/Backend
        run: |
          dotnet build --configuration Release
          nohup dotnet run --configuration Release &
          sleep 10
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5000
      - name: Start frontend
        working-directory: ./src/Frontend
        run: |
          npm install
          npm run build
          nohup npm start &
          sleep 15
        env:
          PORT: 3000
          NODE_ENV: production
      - name: Wait for services to be ready
        run: |
          timeout 60 sh -c 'until curl -f http://localhost:3000/api/health || curl -f http://localhost:3000; do sleep 2; done'
          timeout 60 sh -c 'until curl -f http://localhost:5000/health || curl -f http://localhost:5000; do sleep 2; done'
      - name: Install E2E test dependencies
        working-directory: ./src/Frontend/tests
        run: npm install
      - name: Install Playwright browsers
        working-directory: ./src/Frontend/tests
        run: npx playwright install --with-deps
      - name: Run E2E tests
        working-directory: ./src/Frontend/tests
        run: npm test
        env:
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:5000
          TEST_USERNAME: user1
          TEST_PASSWORD: password1
          NODE_TLS_REJECT_UNAUTHORIZED: 0
      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: |
            src/Frontend/tests/test-results/
            src/Frontend/tests/playwright-report/