server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location /static/ {
        expires 1y;
        add_header Cache-Control "public";
    }
    
    location /api/ {
        try_files $uri $uri/ =404;
    }
    
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}